# Server configuration
server:
  host: "127.0.0.1"
  port: 8001
  debug: true
  reload: true

# Database configuration
database:
  type: "csv"  # Options: csv, mongodb, postgresql
  csv_path: "./data/"
#  mongodb:
#    uri: "mongodb://localhost:27017/"
#    db_name: "ai_ecommerce"
#    product_collection: "products"
#    sentiment_collection: "sentiment_analysis"
#    price_prediction_collection: "price_predictions"

# Scraper configuration
scraper:
  max_products_per_site: 20
  delay_between_requests: [1, 3]  # Random delay range in seconds
  timeout: 30
  platforms:
    - name: "amazon"
      base_url: "https://www.amazon.com"
      search_url: "https://www.amazon.com/s?k={search_term}"
      enabled: true
    - name: "ebay"
      base_url: "https://www.ebay.com"
      search_url: "https://www.ebay.com/sch/i.html?_nkw={search_term}"
      enabled: true

# AI Model configuration
sentiment_analysis:
  model_name: "distilbert-base-uncased-finetuned-sst-2-english"
  threshold:
    positive: 0.6
    negative: 0.4
  batch_size: 16

price_prediction:
  model_type: "prophet"  # Options: prophet, arima, lstm
  forecast_periods: 30  # Days
  train_test_split: 0.8